<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | IECS Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            ring: 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error { background: #fef2f2; color: #dc2626; display: block; }
        .success { background: #f0fdf4; color: #16a34a; display: block; }

        .footer-link {
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="logo">IECS Connect</div>
    <h2>Thiết lập mật khẩu mới</h2>
    
    <form id="resetForm">
        <div class="input-group">
            <label>Mật khẩu mới</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>
        
        <div class="input-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirm" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn">Cập nhật mật khẩu</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>

    <div class="footer-link">
        Sau khi hoàn tất, hãy quay lại ứng dụng để đăng nhập.
    </div>
</div>

<script>
    // Tự động lấy "code" từ URL (Strapi mặc định gửi ?code=...)
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code"); 
    const API_URL = "https://connect.iecs.vn/api/auth/reset-password";
    
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("statusMsg");
    const btn = document.getElementById("submitBtn");

    form.onsubmit = async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        // 1. Kiểm tra khớp mật khẩu
        if (password !== confirm) {
            showMsg("Mật khẩu xác nhận không khớp!", "error");
            return;
        }

        // 2. Kiểm tra mã token (code)
        if (!code) {
            showMsg("Liên kết không hợp lệ. Vui lòng yêu cầu lại mã mới.", "error");
            return;
        }

        setLoading(true);

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    code: code, 
                    password: password, 
                    passwordConfirmation: confirm 
                }),
            });

            const data = await res.json();

            if (res.ok) {
                showMsg("Thành công! Mật khẩu đã được cập nhật.", "success");
                form.reset();
                btn.style.display = "none";
            } else {
                showMsg(data.error?.message || "Đã xảy ra lỗi, vui lòng thử lại.", "error");
            }
        } catch (err) {
            showMsg("Lỗi kết nối. Vui lòng kiểm tra internet.", "error");
        } finally {
            setLoading(false);
        }
    };

    function showMsg(text, type) {
        msg.textContent = text;
        msg.className = `status-msg ${type}`;
    }

    function setLoading(isLoading) {
        btn.disabled = isLoading;
        btn.textContent = isLoading ? "Đang xử lý..." : "Cập nhật mật khẩu";
    }
</script>

</body>
</html>
