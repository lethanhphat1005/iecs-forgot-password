<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | IECS Connect</title>
    
    <link rel="icon" type="image/png" href="https://connect.iecs.vn/uploads/Frame_4995_732d442279.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER CHỨA LOGO LẤY TỪ LINK BẠN CUNG CẤP */
        header {
            width: 100%;
            padding: 40px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-logo {
            height: 100px; /* Tăng kích thước logo cho rõ nét */
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .header-logo:hover {
            transform: scale(1.05);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .sub-text {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -3px rgba(79, 70, 229, 0.4);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 14px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            line-height: 1.5;
        }

        .error { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
        .success { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <img src="https://connect.iecs.vn/uploads/Frame_4995_732d442279.png" alt="IECS Logo" class="header-logo">
</header>

<div class="container">
    <div class="glass-card">
        <h2>Thiết lập mật khẩu mới</h2>
        <p class="sub-text">Cập nhật mật khẩu cho tài khoản IECS Connect</p>
        
        <form id="resetForm">
            <div class="input-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            </div>
            
            <div class="input-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" required>
            </div>

            <button type="submit" id="submitBtn">Cập nhật mật khẩu</button>
            <div id="statusMsg" class="status-msg"></div>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code") || urlParams.get("token"); 
    const API_URL = "https://connect.iecs.vn/api/auth/reset-password";
    
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("statusMsg");
    const btn = document.getElementById("submitBtn");

    form.onsubmit = async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (password !== confirm) {
            showMsg("❌ Mật khẩu xác nhận không khớp!", "error");
            return;
        }

        if (!code) {
            showMsg("⚠️ Liên kết không hợp lệ. Vui lòng gửi lại yêu cầu từ App.", "error");
            return;
        }

        setLoading(true);

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    code: code, 
                    password: password, 
                    passwordConfirmation: confirm 
                }),
            });

            if (res.ok) {
                showMsg("✅ Thành công! Mật khẩu đã được cập nhật. Bạn có thể quay lại App để đăng nhập.", "success");
                form.reset();
                btn.style.display = "none";
            } else {
                const data = await res.json();
                showMsg("❌ " + (data.error?.message || "Mã xác thực không hợp lệ."), "error");
            }
        } catch (err) {
            showMsg("🚨 Lỗi kết nối. Vui lòng thử lại sau.", "error");
        } finally {
            setLoading(false);
        }
    };

    function showMsg(text, type) {
        msg.textContent = text;
        msg.className = `status-msg ${type}`;
        msg.style.display = "block";
    }

    function setLoading(isLoading) {
        btn.disabled = isLoading;
        btn.textContent = isLoading ? "Đang xử lý..." : "Cập nhật mật khẩu";
    }
</script>

</body>
</html>
