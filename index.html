<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu - IECS Connect</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    h2 {
      color: #4f46e5;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      margin-top: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #3730a3;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .success {
      color: green;
      font-weight: 600;
    }

    .error {
      color: red;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đặt lại mật khẩu</h2>
    <form id="resetForm">
      <input type="password" id="password" placeholder="Mật khẩu mới" required />
      <input type="password" id="confirm" placeholder="Xác nhận mật khẩu" required />
      <button type="submit" id="submitBtn">Xác nhận</button>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get("token"); // lấy từ ?token=
    const apiUrl = "http://localhost:1337/api/auth/reset-password";
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    // if (!token) {
    //   message.textContent = "❌ Link không hợp lệ hoặc đã hết hạn.";
    //   message.className = "message error";
    //   document.getElementById("resetForm").style.display = "none";
    // }

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        message.textContent = "⚠️ Mật khẩu xác nhận không khớp!";
        message.className = "message error";
        return;
      }

      button.disabled = true;
      button.textContent = "Đang xử lý...";
      message.textContent = "";

      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });

        const data = await res.json();

        if (res.ok) {
          message.textContent = "✅ Đặt lại mật khẩu thành công! Bạn có thể đăng nhập lại trong app.";
          message.className = "message success";
          document.getElementById("resetForm").reset();
        } else {
          message.textContent = "❌ " + (data.error?.message || "Token không hợp lệ hoặc đã hết hạn.");
          message.className = "message error";
        }
      } catch (err) {
        message.textContent = "🚨 Lỗi kết nối đến máy chủ.";
        message.className = "message error";
      }

      button.disabled = false;
      button.textContent = "Xác nhận";
    });
  </script>
</body>
</html>
